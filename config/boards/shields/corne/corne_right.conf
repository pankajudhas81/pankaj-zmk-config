# ═══════════════════════════════════════════════════════════════════
# FILE: config/boards/shields/corne/corne_right.conf
# ROLE: Right-half specific config — extends corne.conf for the peripheral (BLE-only) side.
#
# The right half has no USB connection to the host; it communicates exclusively
# over BLE to the central (left) half. It runs a custom OLED status screen
# (Trishul logo + battery + BLE status) drawn with LVGL primitives defined in
# custom_status_screen.c. LVGL graphics library options live here because the
# custom screen uses them and they are only needed on this half.
# ═══════════════════════════════════════════════════════════════════


# ─── RGB Underglow ────────────────────────────────────────────────────────────

# Master switch: enable the RGB underglow LEDs on this half.
# Each split half controls its own LED strip independently.
# Turn off (=n) to save battery if you do not use the lights on the right side.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Automatically turn off RGB when the keyboard enters the idle state.
# Saves battery without requiring you to manually toggle the LEDs.
# The LEDs come back on as soon as a key is pressed to wake the keyboard.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y


# ─── OLED Display ─────────────────────────────────────────────────────────────

# Master switch: enable the OLED display driver on this half.
# When on, ZMK initialises the I2C bus and the SSD1306 driver (both auto-
# enabled in Kconfig.defconfig whenever this option is set).
CONFIG_ZMK_DISPLAY=y

# Switch to a fully custom status screen instead of ZMK's built-in layout.
# When this is set, ZMK skips its default widget arrangement and instead calls
# zmk_display_status_screen() from your own source file (custom_status_screen.c)
# to build and return whatever LVGL widget tree you define.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Disable the nice!view shield's default status widget.
# The nice!view shield ships its own opinionated status widget; setting this to
# 'n' prevents it from registering so our custom screen has full control of the
# display without the two implementations fighting over it.
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# Enable the custom Corne display feature flag defined in Kconfig.defconfig.
# This Kconfig symbol is the CMake gate: when 'y', CMakeLists.txt adds
# custom_status_screen.c to the build so the linker can find the symbol that
# ZMK_DISPLAY_STATUS_SCREEN_CUSTOM requires.  Without this, the build would
# fail with an undefined reference to zmk_display_status_screen().
CONFIG_CORNE_CUSTOM_DISPLAY=y


# ─── Built-in Widgets used by the custom screen ───────────────────────────────

# Enable ZMK's built-in battery-status widget.
# Even though we draw a custom screen, we still use ZMK's pre-built battery
# widget as a data-source object inside custom_status_screen.c rather than
# re-implementing battery polling from scratch.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y

# Enable ZMK's built-in peripheral-connection-status widget.
# Provides the object that tracks whether this peripheral is connected to the
# central half over BLE, which the custom screen displays on the OLED.
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y


# ─── LVGL Graphics Library ────────────────────────────────────────────────────
#
# LVGL (Light and Versatile Graphics Library) is the embedded GUI toolkit that
# ZMK's display subsystem uses under the hood to draw on the OLED.  The options
# below enable exactly the drawing primitives and fonts that custom_status_screen.c
# relies on — enabling only what is needed keeps flash and RAM usage minimal.

# Enable LVGL image drawing support (lv_img_t objects).
# Required to draw the "P" keycap logo bitmap on the custom screen.
CONFIG_LV_USE_IMAGE=y

# Enable LVGL label widgets (lv_label_t objects).
# Required to draw text strings (layer name, battery %, connection state, etc.)
# anywhere on the custom screen.
CONFIG_LV_USE_LABEL=y

# Enable LVGL's built-in monochrome theme.
# The mono theme is purpose-built for 1-bit black-and-white OLED displays: it
# keeps all colours as pure black or white and disables anti-aliasing, which
# produces sharp, crisp rendering on the SSD1306 without wasted calculation.
CONFIG_LV_USE_THEME_MONO=y

# Include the Montserrat 16 px bitmap font in the firmware.
# This font is used by custom_status_screen.c for readable status text.
# Including only the sizes actually used keeps flash consumption down.
CONFIG_LV_FONT_MONTSERRAT_16=y

# Set Montserrat 16 px as the default LVGL font.
# Any LVGL widget that does not explicitly specify a font will fall back to this
# one, so text elements in the custom screen are automatically rendered at 16 px.
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# LVGL heap size in bytes available for dynamic widget allocation.
# LVGL internally mallocs space for widget structures, style descriptors, and
# image pixel buffers from this pool.  4096 bytes is the minimum that keeps the
# custom screen's widget tree and the logo image comfortably within bounds
# without wasting RAM on a memory-constrained microcontroller.
CONFIG_LV_Z_MEM_POOL_SIZE=4096
