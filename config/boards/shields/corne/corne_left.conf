# ═══════════════════════════════════════════════════════════════════
# FILE: config/boards/shields/corne/corne_left.conf
# ROLE: Left-half specific config — extends corne.conf for the central (USB) side.
#
# The left half is the central half: it connects to the host via USB, merges
# keycodes from both halves into a single HID report, and is the only side that
# can run ZMK Studio. Only options that differ from or extend corne.conf need
# to appear here; everything in corne.conf already applies to both halves.
# ═══════════════════════════════════════════════════════════════════


# ─── ZMK Studio ───────────────────────────────────────────────────────────────

# Enables ZMK Studio — the live keymap editor GUI that communicates with the
# keyboard over USB without needing a full firmware reflash to remap keys.
# Studio only makes sense on the central (left) half because that is the half
# physically connected to the host via USB; the right peripheral has no USB
# link to the host and therefore cannot run Studio.
CONFIG_ZMK_STUDIO=y

# Locking: when enabled, Studio requires a PIN before it will accept keymap
# changes — useful in shared / public environments.
# Set to 'y' to protect the keyboard from accidental or unauthorised remaps.
CONFIG_ZMK_STUDIO_LOCKING=n

# When locking is active, automatically re-lock Studio as soon as the BLE
# host disconnects (e.g. you unplug USB or the host goes to sleep).
# Has no effect when STUDIO_LOCKING=n.
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n


# ─── RGB Underglow ────────────────────────────────────────────────────────────

# Master switch: enable the RGB underglow LEDs on this half.
# The left half has its own LED strip; each half is configured independently.
# Turn off (=n) to save significant battery if you do not use the lights.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Automatically turn off RGB when the keyboard enters the idle state.
# Saves battery without requiring you to manually toggle the LEDs.
# The LEDs come back on as soon as a key is pressed to wake the keyboard.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y


# ─── OLED Display ─────────────────────────────────────────────────────────────

# Master switch: enable the OLED display driver on this half.
# When on, ZMK initialises the I2C bus and the SSD1306 driver (both of which
# are auto-enabled in Kconfig.defconfig whenever this option is set).
# Turn off (=n) to save power if you do not want a screen on the left side.
CONFIG_ZMK_DISPLAY=y

# Use the standard ZMK built-in status screen layout.
# The built-in screen shows battery level, BLE connection state, layer name,
# and other standard ZMK widgets arranged in ZMK's default layout — no custom
# code or LVGL setup required.
# Set to 'n' and enable ZMK_DISPLAY_STATUS_SCREEN_CUSTOM if you want to draw
# your own screen (see corne_right.conf for an example of that path).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
