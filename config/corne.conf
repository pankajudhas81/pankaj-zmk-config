# ═══════════════════════════════════════════════════════════════════
# FILE: config/corne.conf
# ROLE: Master keyboard config — top-level Kconfig options shared by both halves.
#
# Controls battery reporting, key debounce, Bluetooth device name, idle and
# deep-sleep timeouts, RGB underglow, OLED display, mouse keys, and ZMK Studio.
# Options set here apply to every firmware image built from this config; use
# corne_left.conf or corne_right.conf for per-half overrides. This is the
# first file to edit when tuning keyboard behaviour.
# ═══════════════════════════════════════════════════════════════════


# ─── Battery ─────────────────────────────────────────────────────────────────

# How often (in seconds) the keyboard reports its battery level to the host.
# Lower values give more up-to-date readings but cost a tiny bit of power.
# 60 = update the battery percentage every 1 minute.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60


# ─── Key Scan / Debounce ──────────────────────────────────────────────────────

# Debounce window (milliseconds) a key must be held before a PRESS is registered.
# Prevents phantom key-down events from mechanical contact bounce.
# Default is 5 ms; raise to 8–10 ms if you get double-presses.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5

# Debounce window (milliseconds) after release before the key is considered UP.
# Prevents phantom key-up events. Usually kept equal to the press value.
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5


# ─── Identity ─────────────────────────────────────────────────────────────────

# The Bluetooth device name shown to your OS / phone when pairing.
# Change this if you run multiple ZMK boards and want to tell them apart.
CONFIG_ZMK_KEYBOARD_NAME="Corne"


# ─── Bluetooth Compatibility ──────────────────────────────────────────────────

# Disables the GATT subscription enforcement that causes a battery-level bug
# on Windows hosts (the host stops receiving notifications).
# Set to 'n' to fix Windows; set back to 'y' if you only use macOS/Linux.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n


# ─── OLED Display ─────────────────────────────────────────────────────────────

# Master switch: enable the OLED display driver.
# Turn off (=n) to save power if you don't use the screen.
CONFIG_ZMK_DISPLAY=y

# Run display updates on a dedicated work-queue thread instead of the main one.
# Keeps the display responsive without blocking key-scan or BLE tasks.
# Recommended to leave on (=y) whenever the display is enabled.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Shows words-per-minute as a widget on the OLED.
# Uncomment (remove the leading #) to enable.
#CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Shows the currently active keymap layer name/number on the OLED.
# Uncomment to enable.
#CONFIG_ZMK_WIDGET_LAYER_STATUS=n

# Shows which half (central / peripheral) is connected on the OLED.
# Useful for split keyboards to confirm the wireless link is up.
# Uncomment to enable.
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n

# Displays an animated Bongo Cat that reacts to your typing rhythm.
# Uncomment to enable (requires ZMK Bongo Cat module).
#CONFIG_ZMK_WIDGET_BONGO_CAT=y


# ─── Idle & Deep Sleep ────────────────────────────────────────────────────────

# Milliseconds of inactivity before the keyboard enters the IDLE state.
# In idle: display turns off, RGB dims — BLE stays alive, wakes on keypress.
# 600000 ms = 10 minutes.
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Master switch: enable deep-sleep support.
# Deep sleep cuts power to almost everything; BLE disconnects.
# The keyboard wakes on the next keypress and reconnects automatically.
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity (from the idle entry point) before entering DEEP SLEEP.
# Must be larger than IDLE_TIMEOUT — deep sleep kicks in after idle.
# 900000 ms = 15 minutes (so: 10 min idle → then 5 more min → deep sleep).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# ─── Mouse / Pointing ─────────────────────────────────────────────────────────

# Enables the ZMK pointing / mouse-keys subsystem.
# Required to use mouse movement, scroll, or button behaviors in your keymap.
CONFIG_ZMK_POINTING=y


# ─── ZMK Studio ───────────────────────────────────────────────────────────────

# Enables ZMK Studio — the live keymap editor GUI that talks to the keyboard
# over USB/BLE without needing a full firmware flash to remap keys.
CONFIG_ZMK_STUDIO=y

# Locking: when enabled, Studio requires a PIN before accepting changes.
# Set to 'y' if you want to prevent accidental remaps.
CONFIG_ZMK_STUDIO_LOCKING=n

# If locking is on, automatically lock Studio when the BLE host disconnects.
# No effect when STUDIO_LOCKING=n.
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n


# ─── RGB Underglow ────────────────────────────────────────────────────────────

# Master switch: enable the RGB underglow LEDs.
# Turn off (=n) to save significant battery on wireless builds.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Automatically turn off RGB when the keyboard enters idle state.
# Saves battery without you having to remember to switch the lights off.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Which effect index to start on at power-up.
# Effects are numbered 0-based in the ZMK underglow effect list.
# 3 = typically "Swirl" or similar, depending on your ZMK build.
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Maximum brightness cap (0–100).
# Lower values = less power draw and less eye-strain in dark rooms.
# 60 = 60 % max brightness.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# Tie RGB power to the external-power toggle behavior (&ext_power).
# Set to 'y' if you have a physical power-switch behavior in your keymap
# and want it to also kill the LEDs. 'n' = RGB managed independently.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
