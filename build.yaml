# FilePath: build.yaml

# ═══════════════════════════════════════════════════════════════════
# FILE: build.yaml
# ROLE: GitHub Actions build matrix — lists every firmware image to compile.
#
# The zmk-config GitHub Actions CI workflow reads this file automatically and
# compiles one .uf2 image per entry: OLED left/right, nice!view left/right,
# and the settings-reset flasher. Add a new entry here to build a new shield
# variant; the board field uses ZMK's nice_nano//zmk qualifier syntax.
# ═══════════════════════════════════════════════════════════════════

---
include:

  # ─── OLED Display Builds (built-in SSD1306, driven by the corne shield) ───────
  #
  # These two targets build firmware for the standard Corne with the small
  # OLED screens that come soldered to the PCB.  The OLED is wired via I2C
  # and is declared in the corne shield itself (see corne.zmk.yml: exposes
  # [i2c_oled]).
  #
  # Only the LEFT half gets the `studio-rpc-usb-uart` snippet because the
  # left half is the "central" side — it is the one connected to the host
  # computer via USB.  ZMK Studio communicates over that USB connection, so
  # the Studio RPC transport only needs to be enabled on the central half.
  # The right half runs as a "peripheral" over BLE to the left, so adding
  # the snippet there would have no effect.

  # Left half — central side.  Studio snippet enabled so ZMK Studio can
  # connect over USB UART and allow live keymap editing without reflashing.
  - board: nice_nano//zmk
    shield: corne_left
    # studio-rpc-usb-uart: wires the ZMK Studio RPC protocol over the USB
    # serial (UART) interface, enabling live keymap editing from the ZMK
    # Studio desktop/web app while the keyboard is plugged in via USB.
    snippet: studio-rpc-usb-uart

  # Right half — peripheral side.  No Studio snippet needed; the right half
  # communicates with the host only through the left half via BLE.
  - board: nice_nano//zmk
    shield: corne_right

  # ─── nice!view Display Builds (nice!view e-paper-style display via SPI) ───────
  #
  # These targets add two extra shields on top of the base corne shield:
  #   nice_view_adapter — an interposer PCB that bridges the Corne's I2C OLED
  #                       connector to the SPI bus the nice!view needs.
  #   nice_view         — the ZMK-provided shield for the nice!view display
  #                       itself (handles the SPI driver and custom widgets).
  #
  # All three shield names are space-separated in a single `shield:` value;
  # ZMK's build system overlays them in order.
  #
  # The same Studio/central rule applies: left gets the snippet, right does not.

  # Left half with nice!view display.
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart

  # Right half with nice!view display.
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view

  # ─── Settings Reset ───────────────────────────────────────────────────────────
  #
  # This is a special utility firmware — NOT a normal typing firmware.
  # Flash this to a half when you need to wipe all stored BLE pairing bonds
  # (e.g., after pairing with too many hosts, or if the keyboard refuses to
  # reconnect after switching computers).
  #
  # Procedure:
  #   1. Flash settings_reset.uf2 to both halves one at a time.
  #   2. After the reset LED pattern, reflash the normal left/right firmware.
  #   3. Re-pair the keyboard to your host(s) from scratch.
  #
  # The settings_reset shield is bundled with ZMK; no custom shield code here.
  - board: nice_nano//zmk
    shield: settings_reset
