name: Draw Keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**/*.keymap"
      - "keymap-viewer.html"

concurrency:
  group: draw-keymap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install keymap-drawer
        run: pip install keymap-drawer==0.23.0

      - name: Check keymap-viewer.html is in sync
        run: node scripts/check-viewer-sync.js

      - name: Parse and draw keymap
        run: |
          keymap -c config/keymap_drawer.config.yaml parse -z config/corne.keymap > /tmp/corne_keymap.yaml
          keymap -c config/keymap_drawer.config.yaml draw -n "33333+3 3+33333" /tmp/corne_keymap.yaml > corne_keymap.svg

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corne_keymap.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update keymap SVG [skip ci]"
            git push
          fi
